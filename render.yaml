# Render service definition — https://render.com/docs/blueprint-spec
# This file defines services for Blueprint-based deploys.
# Secrets (DATABASE_URL, JWT_SECRET, etc.) must be set in the Render dashboard
# or via environment groups — never commit real values here.

# Render service definition — https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gradiliste-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    region: frankfurt
    plan: starter
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_VERSION
        value: production

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: COOKIE_SECURE
        value: "true"

      - key: COOKIE_SAME_SITE
        value: none

      - key: UPLOAD_STORAGE_DRIVER
        value: s3

      - key: S3_ENDPOINT
        sync: false

      - key: S3_BUCKET
        sync: false

      - key: S3_ACCESS_KEY_ID
        sync: false

      - key: S3_SECRET_ACCESS_KEY
        sync: false

      - key: S3_REGION
        value: auto

      - key: S3_USE_PATH_STYLE
        value: "true"

      - key: LOG_LEVEL
        value: info

      - key: BCRYPT_COST
        value: "12"
