version: '3.8'

# Production template — VPS / self-hosted deployment.
# Usage:
#   cp docker-compose.prod.example.yml docker-compose.prod.yml
#   Edit docker-compose.prod.yml — fill in all CHANGE_ME values.
#   NEVER commit docker-compose.prod.yml to version control.
#
# For managed cloud deployment (Fly.io, Railway, Render, Vercel),
# see docs/deployment.md — you do NOT need this file.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradiliste
      POSTGRES_PASSWORD: CHANGE_ME_STRONG_DB_PASSWORD
      POSTGRES_DB: gradiliste
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Do NOT expose port 5432 to the host in production.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradiliste"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      SERVER_PORT: "8080"

      # Use DATABASE_URL for managed databases, or keep DB_* for the postgres container above.
      # DATABASE_URL: postgres://gradiliste:CHANGE_ME_STRONG_DB_PASSWORD@postgres:5432/gradiliste?sslmode=disable
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: gradiliste
      DB_PASSWORD: CHANGE_ME_STRONG_DB_PASSWORD
      DB_NAME: gradiliste

      # Generate with: openssl rand -base64 48
      JWT_SECRET: CHANGE_ME_GENERATE_WITH_OPENSSL
      JWT_EXPIRES_IN: "15m"
      BCRYPT_COST: "12"

      # Set to your production frontend URL (comma-separated for multiple)
      CORS_ALLOWED_ORIGINS: "https://app.example.com"

      UPLOAD_STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: "10"

      LOG_LEVEL: info
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Uncomment to self-host the Next.js frontend.
  # For Vercel deployment, skip this block.
  # web:
  #   build:
  #     context: ./apps/web
  #     dockerfile: Dockerfile
  #     args:
  #       NEXT_PUBLIC_API_URL: https://api.example.com/api
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api

volumes:
  postgres_data:
  uploads_data:
