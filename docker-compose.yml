version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gradiliste_db
    environment:
      POSTGRES_USER: gradiliste
      POSTGRES_PASSWORD: gradiliste_dev_password
      POSTGRES_DB: gradiliste
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d   
      - ./database/seeds/seed_phase2.sql:/docker-entrypoint-initdb.d/seed_phase2.sql:ro
      - ./database/seeds/seed_phase4.sql:/docker-entrypoint-initdb.d/seed_phase4.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradiliste"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: gradiliste_api
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: gradiliste
      DB_PASSWORD: gradiliste_dev_password
      DB_NAME: gradiliste
      ENV: development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy


  # Optional: frontend service (comment out if developing locally)
  # web:
  #   build:
  #     context: ./apps/web
  #     dockerfile: Dockerfile
  #   container_name: gradiliste_web
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8080/api
  #   depends_on:
  #     - api

volumes:
  postgres_data:
