version: '3.8'

# Default local development compose.
# For an explicit dev file use: docker compose -f docker-compose.dev.yml up
# For production template see: docker-compose.prod.example.yml
#
# Secrets come from services/api/.env (git-ignored).
# Copy services/api/.env.example → services/api/.env before first run.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gradiliste_db
    environment:
      POSTGRES_USER: gradiliste
      POSTGRES_PASSWORD: gradiliste_dev_password
      POSTGRES_DB: gradiliste
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
      - ./database/seeds/seed_phase2.sql:/docker-entrypoint-initdb.d/seed_phase2.sql:ro
      - ./database/seeds/seed_phase4.sql:/docker-entrypoint-initdb.d/seed_phase4.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradiliste"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: gradiliste_api
    env_file:
      - ./services/api/.env
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
